name: Bug Report
description: Report a non-security bug in Alp
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Security issue? Don't use this template** — see [SECURITY.md](../SECURITY.md).

        Public tracker: don't paste logs, keys, passphrases, message contents,
        or email addresses. We'll ask privately if we need diagnostics.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: What went wrong, what you expected, and how to reproduce it if you can.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Alp (bottom of Settings → General), macOS, and GnuPG (`gpg --version`).
      placeholder: Alp 0.9.0 · macOS 26.1 · gpg 2.5.20
    validations:
      required: true
