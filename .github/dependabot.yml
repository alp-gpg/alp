version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    groups:
      # init and analyze must move together; split PRs leave them mismatched.
      codeql-action:
        patterns:
          - "github/codeql-action*"
