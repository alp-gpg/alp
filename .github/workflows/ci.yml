name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI only reads the repo (checkout, build, test, lint) — pin the token to
# read-only so a compromised action or script can't write to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for CURRENT_PROJECT_VERSION git count

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.app || \
            sudo xcode-select -s /Applications/Xcode_26.3.app || \
            sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Install Tuist
        run: |
          brew install --cask tuist
          tuist version

      - name: Install GnuPG
        run: |
          brew install gnupg
          gpg --version | head -1

      # Generates the project, builds, then runs the tests against a throwaway
      # $HOME holding a freshly generated fixture key — same script contributors
      # run locally, so a green CI and a green laptop mean the same thing.
      - name: Build & Test
        run: |
          bash scripts/test.sh \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

  lint:
    name: Lint
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: SwiftFormat (check only)
        run: swiftformat --lint .
